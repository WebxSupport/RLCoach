# RLCoach — nginx reverse proxy (HTTP-only starting config).
#
# This is intentionally HTTP-only. After it's live, run:
#   sudo certbot --nginx -d YOUR_DOMAIN -d www.YOUR_DOMAIN --redirect ...
# and certbot automatically adds the HTTPS (443) server block, the certificate
# paths, HTTP/2, and the HTTP->HTTPS redirect — version-correct for whatever
# nginx is installed. Security headers (HSTS, X-Frame-Options, etc.) are emitted
# by the app itself, so they aren't duplicated here.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Replays/JSON are small; cap request bodies
    client_max_body_size 8M;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Server-Sent Events (job progress) — no buffering, long timeouts
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
        proxy_cache         off;
        chunked_transfer_encoding on;
    }
}
