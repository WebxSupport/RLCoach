<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>RLCoach — Series Report</title>
<link rel="icon" type="image/png" href="/static/favicon.png"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --bg:#070b11;--panel:#0d1521;--panel2:#101c2c;--line:#1b2a3e;--line2:#26384f;
  --txt:#e7eff8;--muted:#8093a8;--dim:#6b7f96;
  --cyan:#34d6f7;--blue:#3a8dff;--amber:#ffb347;--green:#34e0a0;--red:#ff5d73;--orange:#ff9e42;
  --mono:'IBM Plex Mono',ui-monospace,monospace;--disp:'Oxanium',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--disp);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 500px at 80% -10%,#0f2236 0%,transparent 60%),
  radial-gradient(700px 400px at -10% 110%,#131b2e 0%,transparent 55%),var(--bg);min-height:100vh}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:9px 22px;background:#0b1420ee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.topbar a.home{display:inline-flex;align-items:center;gap:8px;color:var(--cyan);text-decoration:none;font-weight:700;font-size:15px}
.topbar .kick{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em}
.topbar .who{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.wrap{max-width:1060px;margin:0 auto;padding:24px 20px}
.hero{border:1px solid var(--line2);border-radius:16px;padding:22px 24px;margin-bottom:18px;
  background:linear-gradient(120deg,#0f1f30,#0b1420)}
.hero .k{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--cyan)}
.hero h1{font-size:23px;font-weight:800;margin-top:8px;line-height:1.3}
.hero .summary{font-size:14px;color:#c8d4e2;margin-top:10px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media(max-width:680px){.kpis{grid-template-columns:1fr}}
.kpi{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:14px 16px}
.kpi .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:800;margin-top:5px}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
.card{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel2),var(--panel));padding:20px 22px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:800;margin-bottom:4px}
.card .sub{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px}
/* win vs loss */
.wvl{display:flex;flex-direction:column;gap:12px}
.wvl-row{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
.wvl-row .m{font-size:13px;font-weight:700}
.wvl-bars{display:flex;flex-direction:column;gap:5px}
.wvl-bar{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px}
.wvl-bar .tag{width:34px;color:var(--muted)}
.wvl-bar .track{flex:1;height:14px;border-radius:5px;background:#0c1623;border:1px solid var(--line);overflow:hidden}
.wvl-bar .track>div{height:100%;border-radius:5px}
.wvl-bar.win .track>div{background:var(--green)} .wvl-bar.loss .track>div{background:var(--red)}
.wvl-bar .val{width:46px;text-align:right;color:var(--txt)}
.wvl-row .insight{grid-column:2;font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.item{border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px;background:#0c1623}
.item .it{font-size:13.5px;font-weight:700} .item .id{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.habit{border:1px solid var(--red);border-left:3px solid var(--red);border-radius:10px;padding:14px 16px;background:#170c12}
.habit .t{font-weight:800;font-size:15px} .habit .d{font-size:13px;color:#cdd9e6;margin-top:6px;line-height:1.55}
.trend{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.fix{border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:12px 14px;background:#0c1623;margin-bottom:10px}
.fix .t{font-weight:800;font-size:14px} .fix .d{font-size:12.5px;color:var(--muted);margin:4px 0 8px;line-height:1.45}
.fix .m{font-family:var(--mono);font-size:11px;color:var(--amber)}
/* per-game strip */
.games{display:flex;gap:7px;flex-wrap:wrap}
.gpill{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:#0c1623;min-width:78px}
.gpill.win{border-left:3px solid var(--green)} .gpill.loss{border-left:3px solid var(--red)} .gpill.draw{border-left:3px solid var(--amber)}
.gpill .r{font-family:var(--mono);font-weight:700;font-size:13px} .gpill .r.win{color:var(--green)} .gpill .r.loss{color:var(--red)}
.gpill .mp{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:2px}
.foot{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;margin:24px 0}
.empty{color:var(--muted);font-family:var(--mono);font-size:12px}
</style>

<div class="topbar">
  <a class="home" href="/">&larr; <img src="/static/logo.png" alt="RLCoach" style="height:22px;width:auto"/></a>
  <span class="kick">SERIES REPORT</span>
  <span class="who" id="who"></span>
</div>

<div class="wrap">
  <div class="hero" id="hero"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h2>Per-game results</h2><div class="sub">Most recent first</div><div class="games" id="games"></div></div>
  <div class="card"><h2>What separates your wins from losses</h2><div class="sub">Where your winning games differ most from your losses</div><div class="wvl" id="wvl"></div></div>
  <div class="card"><h2>Consistency</h2><div class="sub">How steady your level was across the session</div><div id="consistency"></div></div>
  <div class="card"><h2>The one recurring habit</h2><div id="habit"></div></div>
  <div class="card"><h2>Top 3 fixes this session</h2><div id="fixes"></div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
/* injected by the server */
const SERIES = {};
/*SERIES_INJECT*/

const esc=s=>(s==null?'':(''+s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $=s=>document.querySelector(s);
const M=SERIES.meta||{}, R=SERIES.record||{};
$("#who").textContent=M.player?('👤 '+M.player):'';
$("#foot").textContent='Series of '+(R.games||0)+' games · '+(M.gamemode||'')+' · generated '+(M.generated||'');

$("#hero").innerHTML=`<div class="k">Session read · ${esc(M.gamemode||'')}</div>
  <h1>${esc(SERIES.headline||'Series analysis')}</h1>
  <div class="summary">${esc(SERIES.summary||'')}</div>`;

const wr = R.games? Math.round(100*R.wins/R.games):0;
const trendTxt=(SERIES.trend||'');
const trendColor=/improv/i.test(trendTxt)?'var(--green)':/declin/i.test(trendTxt)?'var(--red)':'var(--amber)';
const trendArrow=/improv/i.test(trendTxt)?'▲':/declin/i.test(trendTxt)?'▼':'→';
$("#kpis").innerHTML=`
  <div class="kpi"><div class="l">Record</div><div class="v">${R.wins||0}–${R.losses||0}</div><div class="s">${wr}% win rate · ${R.games||0} games</div></div>
  <div class="kpi"><div class="l">Avg goals / shots</div><div class="v">${(SERIES.averages||{}).goals??'—'} / ${(SERIES.averages||{}).shots??'—'}</div><div class="s">per game</div></div>
  <div class="kpi"><div class="l">Trend</div><div class="v" style="color:${trendColor}"><span class="trend">${trendArrow}</span></div><div class="s">${esc(trendTxt)}</div></div>`;

/* per-game */
(function(){
  const g=SERIES.perGame||[];
  if(!g.length){$("#games").innerHTML='<div class="empty">No game data.</div>';return;}
  $("#games").innerHTML=g.map(x=>{
    const cls=x.win?'win':(x.result||'').startsWith('L')?'loss':'draw';
    return `<div class="gpill ${cls}"><div class="r ${cls}">${esc(x.result)}</div><div class="mp">${esc(x.map||'')}</div></div>`;
  }).join('');
})();

/* win vs loss */
(function(){
  const rows=SERIES.winVsLoss||[];
  if(!rows.length){$("#wvl").innerHTML='<div class="empty">Not enough wins/losses to compare.</div>';return;}
  const maxOf=(w,l)=>Math.max(Math.abs(+w||0),Math.abs(+l||0),1);
  $("#wvl").innerHTML=rows.map(r=>{
    const mx=maxOf(r.win,r.loss);
    const wp=Math.min(100,Math.abs(+r.win||0)/mx*100), lp=Math.min(100,Math.abs(+r.loss||0)/mx*100);
    return `<div class="wvl-row">
      <div class="m">${esc(r.metric)}</div>
      <div class="wvl-bars">
        <div class="wvl-bar win"><span class="tag">WIN</span><span class="track"><div style="width:${wp}%"></div></span><span class="val">${esc(r.win)}</span></div>
        <div class="wvl-bar loss"><span class="tag">LOSS</span><span class="track"><div style="width:${lp}%"></div></span><span class="val">${esc(r.loss)}</span></div>
      </div>
      ${r.insight?`<div class="insight">${esc(r.insight)}</div>`:''}
    </div>`;
  }).join('');
})();

/* consistency */
(function(){
  const c=SERIES.consistency||[];
  $("#consistency").innerHTML=c.length?c.map(x=>`<div class="item"><div class="it">${esc(x.label)}</div><div class="id">${esc(x.detail)}</div></div>`).join(''):'<div class="empty">—</div>';
})();

/* habit */
(function(){
  const h=SERIES.recurringHabit||{};
  $("#habit").innerHTML=`<div class="habit"><div class="t">${esc(h.title||'—')}</div><div class="d">${esc(h.detail||'')}</div></div>`;
})();

/* fixes */
(function(){
  const f=SERIES.topFixes||[];
  $("#fixes").innerHTML=f.length?f.map(x=>`<div class="fix"><div class="t">${esc(x.title)}</div><div class="d">${esc(x.detail)}</div><div class="m">${esc(x.metric||'')}</div></div>`).join(''):'<div class="empty">—</div>';
})();
</script>
</html>
